name: Windows cgo smoke

on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "pkg/**"
      - "native/**"
      - "python/**"
      - "scripts/**"
      - ".github/workflows/cgo-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cgo-shared-library:
    name: Windows x86_64 c-shared smoke
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Run Go tests and build the native DLL
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath -u "$RUNNER_TOOL_CACHE")/go/1.25.12/x64/bin:$PATH"
          export CGO_ENABLED=1
          export CC=gcc
          command -v go
          go version
          go vet ./...
          go test -cover ./...
          mkdir -p dist
          go build -buildmode=c-shared -trimpath -ldflags='-s -w' \
            -o dist/recolva.dll ./native
          test -f dist/recolva.dll
          test -f dist/recolva.h

      - name: Build and clean-install the Windows wheel
        shell: pwsh
        run: |
          python scripts/stage_native.py `
            --source dist/recolva.dll `
            --target-directory python/src/recolva/_native
          Push-Location python
          uv build --wheel --out-dir ../dist/wheel
          Pop-Location
          $wheel = Get-ChildItem dist/wheel/*.whl | Select-Object -First 1
          if ($wheel.Name -notlike '*-py3-none-win_amd64.whl') {
            throw "unexpected wheel tag: $($wheel.Name)"
          }
          python -m venv dist/clean-venv
          $venvPython = (Resolve-Path dist/clean-venv/Scripts/python.exe)
          & $venvPython -m pip install --no-index $wheel.FullName
          @'
          import recolva
          from recolva._native import bundled_library_path

          assert bundled_library_path().name == "recolva.dll"
          assert recolva.exponential_score(
              last_accessed=1_000_000,
              now=87_400_000,
              half_life_millis=86_400_000,
          ) == 0.5
          assert recolva.power_law_score(
              last_accessed=1_000_000,
              now=87_400_000,
              scale_millis=86_400_000,
              exponent=1.0,
              importance=0.5,
          ) == 0.25
          print("clean_install_native_calls=passed")
          '@ | Set-Content -NoNewline dist/clean-install-check.py
          Push-Location dist
          & $venvPython -P clean-install-check.py
          Pop-Location

      - name: Upload DLL and generated C header
        uses: actions/upload-artifact@v4
        with:
          name: recolva-windows-x86_64-cshared
          path: |
            dist/recolva.dll
            dist/recolva.h
            dist/wheel/*.whl
          if-no-files-found: error
