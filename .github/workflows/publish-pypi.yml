name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish ${{ matrix.name }} wheel
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            library: libfademem.so
            header: libfademem.h
            wheel_tag: py3-none-manylinux_2_28_x86_64
          - name: macOS arm64
            runner: macos-14
            library: libfademem.dylib
            header: libfademem.h
            wheel_tag: py3-none-macosx_14_0_arm64
          - name: Windows x86_64
            runner: windows-2022
            library: fademem.dll
            header: fademem.h
            wheel_tag: py3-none-win_amd64
    env:
      FADEMEM_WHEEL_TAG: ${{ matrix.wheel_tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Build native library (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test -cover ./...
          mkdir -p dist
          go build -buildmode=c-shared -trimpath -ldflags='-s -w' \
            -o "dist/${{ matrix.library }}" ./native
          test -f "dist/${{ matrix.library }}"
          test -f "dist/${{ matrix.header }}"

      - name: Build native DLL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go vet ./...
          go test -cover ./...
          mkdir -p dist
          go build -buildmode=c-shared -trimpath -ldflags='-s -w' `
            -o "dist/${{ matrix.library }}" ./native
          if (-not (Test-Path "dist/${{ matrix.library }}")) { throw "DLL not found" }
          if (-not (Test-Path "dist/${{ matrix.header }}")) { throw "Header not found" }

      - name: Stage and build wheel
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_native.py \
            --source "dist/${{ matrix.library }}" \
            --target-directory python/src/fademem/_native
          (
            cd python
            uv build --wheel --out-dir ../dist/wheel
          )
          wheel=(dist/wheel/*.whl)
          test "${#wheel[@]}" -eq 1

      - name: Publish to PyPI
        shell: bash
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          uv publish dist/wheel/*.whl
