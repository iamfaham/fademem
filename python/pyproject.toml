[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "memory-decay"
version = "0.1.0.dev0"
description = "Local, composable memory decay scoring and pruning"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Faham" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/decay"]
artifacts = [
  "src/decay/_native/*.dll",
  "src/decay/_native/*.so",
  "src/decay/_native/*.dylib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
