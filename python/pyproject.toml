[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fademem"
version = "0.1.1"
description = "Local, composable memory decay scoring and pruning"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Faham" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/fademem"]
artifacts = [
  "src/fademem/_native/*.dll",
  "src/fademem/_native/*.so",
  "src/fademem/_native/*.dylib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["PLR0402"]
